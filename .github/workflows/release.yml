name: Build and Publish Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: yaml2jsonschema-linux-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: yaml2jsonschema-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact_name: yaml2jsonschema-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact_name: yaml2jsonschema-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build binary
        shell: bash
        run: |
          mkdir dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w" \
          -o dist/${{ matrix.artifact_name }} \
          ./cmd/jsonschema

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
